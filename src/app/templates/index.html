<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <div class="container-fluid">
        <div class="d-flex flex-column ">
            <h1 class="text-center mt-3 mb-5 p-3 fs-1 align-items-center">Dashboard</h1>
        
            <div class="d-flex justify-content-around my-5 p-3 align-items-center">
                <div class="d-flex flex-column justify-content-around border round-2 shadow">
                    <h3 class="m-2 p-3">Temperature</h3>
                    <h4 class="p-2 text-center fw-bold"><span id="temp"></span> °C</h4>
                </div>
                <div class="d-flex flex-column justify-content-around border round-2 shadow">
                    <h3 class="m-2 p-3">Humidity</h3>
                    <h4 class="p-2 text-center fw-bold"><span id="hum"></span> °C</h4>
                </div>
                <div class="d-flex flex-column justify-content-around border round-2 shadow">
                    <h3 class="m-2 p-3">Rain or not</h3>
                    <h4 class="p-2 text-center fw-bold"><span id="pred"></span></h4>
                </div>
                <div class="d-flex flex-column justify-content-around border round-2 shadow">
                    <h3 class="m-2 p-3">Chance of Rain</h3>
                    <h4 class="p-2 text-center fw-bold"><span id="proba"> %</span></h4>
                </div>

            </div>
        </div>
    </div>

    <script>
        function updateData() {
            fetch('/routes/test')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('temp').innerText = data.temperature ?? "---";
                    document.getElementById('hum').innerText = data.humidity ?? "---";
                    let rainText = data.rain === 1 ? "Hujan" : "Tidak Hujan";
                    document.getElementById('pred').innerText = rainText ?? "---";
                    document.getElementById('proba').innerText = data.proba ?? "---";
                    
                })
        }
        setInterval(updateData, 3000);
    </script>

</body>

</html>
